<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 视频会议</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e131f;--panel:#171f31;--panel2:#1e2942;--line:#2a3652;--txt:#e8edf7;--sub:#8ea0c0;--accent:#4f8cff;--danger:#ff5d6c;--ok:#39c98e;
}
body{background:var(--bg);color:var(--txt);font-family:"Microsoft YaHei",system-ui,sans-serif;height:100vh;overflow:hidden}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:8px;padding:7px 14px;font-size:14px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
input{background:#101728;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:14px;outline:none;width:100%}
input:focus{border-color:var(--accent)}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
/* ---------- 登录页 ---------- */
#scr-login{flex-direction:row;background:radial-gradient(1100px 650px at 72% 18%, #182645 0%, var(--bg) 58%)}
.login-left{flex:1.15;display:flex;flex-direction:column;justify-content:center;padding:6vh 5vw;position:relative;overflow:hidden}
.login-left .biglogo{font-size:52px;margin-bottom:16px;filter:drop-shadow(0 6px 18px rgba(79,140,255,.35))}
.login-left h1{font-size:34px;letter-spacing:1px}
.login-left .slogan{color:var(--sub);font-size:15px;margin:10px 0 36px}
.feat{display:flex;align-items:center;gap:12px;color:#c6d3ec;font-size:14px;margin-bottom:16px}
.feat .fi{width:38px;height:38px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.deco-card{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:floaty 7s ease-in-out infinite}
.deco-card .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 8px var(--ok)}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.login-right{width:min(430px,46%);display:flex;align-items:center;justify-content:center;background:var(--panel);border-left:1px solid var(--line)}
.login-box{width:300px}
.login-box h2{font-size:21px;margin-bottom:4px}
.login-box .sub2{color:var(--sub);font-size:13px;margin-bottom:26px}
.field{position:relative;margin-bottom:14px}
.field .fi2{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6;pointer-events:none}
.field input{padding-left:34px}
.field .eye{position:absolute;right:5px;top:50%;transform:translateY(-50%);border:none;background:none;padding:4px 7px;font-size:14px;color:var(--sub)}
.field .eye:hover{color:var(--txt)}
#loginBtn{width:100%;margin-top:6px;height:42px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s}
#loginBtn .spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
#loginBtn.ok{background:var(--ok);border-color:var(--ok)}
#loginStatus{min-height:36px;font-size:13px;line-height:1.5;margin-top:12px;text-align:center}
#loginStatus.err{color:var(--danger)}
#loginStatus.load{color:var(--sub)}
.login-box.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.hint{color:var(--sub);font-size:12px;line-height:1.7;margin-top:14px}
@media(max-width:820px){#scr-login{flex-direction:column}.login-left{display:none}.login-right{width:100%;border-left:none}}
/* ---------- 弹窗 ---------- */
#toasts{position:fixed;top:14px;right:14px;z-index:100;width:320px;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.5);animation:slidein .25s ease}
.toast.warn{border-left-color:var(--danger)}
.toast.ok{border-left-color:var(--ok)}
.toast .tt{margin-bottom:8px;line-height:1.5}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div id="toasts"></div>

<div id="scr-login" class="screen">
  <div class="login-left">
    <div class="biglogo">📹</div>
    <h1>视频会议</h1>
    <p class="slogan">和好友面对面，只需一个浏览器</p>
    <div class="feat"><span class="fi">🎥</span>高清音视频通话 · WebRTC 点对点直连</div>
    <div class="feat"><span class="fi">👥</span>用户名加好友，在线状态一目了然</div>
    <div class="feat"><span class="fi">🔑</span>快速会议 / 会议码加入 / 一周内定时会议</div>
    <div class="deco-card" style="top:11%;right:13%"><span class="dot"></span>张三 · 通话中</div>
    <div class="deco-card" style="bottom:15%;right:27%;animation-delay:1.6s"><span class="dot"></span>李四 · 已静音</div>
    <div class="deco-card" style="bottom:33%;right:6%;animation-delay:3.2s"><span class="dot"></span>会议进行中</div>
  </div>
  <div class="login-right">
    <div class="login-box" id="loginBox">
      <h2>登录</h2>
      <p class="sub2">输入用户名与密码（首次使用将自动注册）</p>
      <div class="field"><span class="fi2">👤</span><input id="loginName" placeholder="用户名（2-16 位）" maxlength="16" autocomplete="username"></div>
      <div class="field"><span class="fi2">🔒</span><input id="loginPass" type="password" placeholder="密码（4-20 位）" maxlength="20" autocomplete="current-password"><button class="eye" id="pwEye" type="button" title="显示 / 隐藏密码">👁</button></div>
      <button id="loginBtn" class="primary">登录</button>
      <p id="loginStatus"></p>
      <p class="hint">用户名全局唯一，密码错误将无法登录<br>进入会议时浏览器会请求 <b>摄像头 / 麦克风权限</b></p>
    </div>
  </div>
</div>

<script>
"use strict";
/* ================= 基础（与 meeting.html 共用的常量/键名必须一致） ================= */
const APP = "vcmeet2026";
const BROKER = "wss://broker.hivemq.com:8884/mqtt";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LS = {
  uid: name => localStorage.getItem(APP + "_uid_" + name),
  setUid: (name, v) => localStorage.setItem(APP + "_uid_" + name, v),
  /* 设备号：每台浏览器一个，跨设备登录同一账号时用于区分设备 */
  devid: () => {
    let v = localStorage.getItem(APP + "_devid");
    if (!v) { v = Math.random().toString(36).slice(2, 10); localStorage.setItem(APP + "_devid", v); }
    return v;
  },
  user: () => localStorage.getItem(APP + "_user") || "",
  setUser: v => localStorage.setItem(APP + "_user", v),
  session: () => { try { return JSON.parse(localStorage.getItem(APP + "_session") || "null"); } catch (e) { return null; } },
  setSession: v => localStorage.setItem(APP + "_session", JSON.stringify(v)),
  clearSession: () => localStorage.removeItem(APP + "_session")
};

let client = null;
let me = { uid: "", name: "" };
let authDone = false;
let loginPwHash = "";
let authRecord = null; // MQTT 上该用户名的注册记录（retained）

/* 密码哈希：安全环境用 SHA-256，非安全环境（如 file://）降级为多轮 FNV 混合哈希 */
async function hashPw(name, pw) {
  const src = APP + "|" + name + "|" + pw;
  if (window.isSecureContext && window.crypto && crypto.subtle) {
    try {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(src));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    } catch (e) { /* 落入降级 */ }
  }
  let h = [0x811c9dc5, 0x01000193, 0xdeadbeef, 0x41c6ce57];
  for (let r = 0; r < 16; r++) {
    for (let i = 0; i < src.length; i++) {
      const c = src.charCodeAt(i) + r * 131;
      h[0] = Math.imul(h[0] ^ c, 16777619) >>> 0;
      h[1] = Math.imul(h[1] + c, 2246822519) >>> 0;
      h[2] = (h[2] ^ Math.imul(c + i, 2654435761)) >>> 0;
      h[3] = (Math.imul(h[3] + c, 668265263) ^ r) >>> 0;
    }
  }
  return h.map(x => x.toString(16).padStart(8, "0")).join("");
}

function toast(text, kind = "", ms = 4200) {
  const d = document.createElement("div");
  d.className = "toast " + kind;
  d.innerHTML = `<div class="tt">${text}</div>`;
  $("toasts").appendChild(d);
  if (ms > 0) setTimeout(() => d.remove(), ms);
  return d;
}

/* ================= 登录页状态 ================= */
function loginIdle() {
  const b = $("loginBtn");
  b.disabled = false; b.classList.remove("ok"); b.textContent = "登录";
  $("loginStatus").textContent = ""; $("loginStatus").className = "";
}
function loginLoading(msg) {
  const b = $("loginBtn");
  b.disabled = true; b.classList.remove("ok");
  b.innerHTML = '<span class="spin"></span>' + esc(msg);
  const s = $("loginStatus"); s.className = "load"; s.textContent = msg;
}
function loginError(msg) {
  loginIdle();
  const s = $("loginStatus"); s.className = "err"; s.innerHTML = msg;
  const box = $("loginBox");
  box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
}
function loginSuccess() {
  const b = $("loginBtn");
  b.disabled = true; b.classList.add("ok"); b.textContent = "✓ 登录成功，正在进入…";
  const s = $("loginStatus"); s.className = ""; s.textContent = "欢迎，" + me.name;
}
$("pwEye").onclick = () => {
  const p = $("loginPass");
  p.type = p.type === "password" ? "text" : "password";
  $("pwEye").textContent = p.type === "password" ? "👁" : "🙈";
};

/* ================= 登录流程 ================= */
$("loginBtn").onclick = async () => {
  const n = $("loginName").value.trim();
  const pw = $("loginPass").value;
  if (n.length < 2) { loginError("用户名至少 2 个字符"); return; }
  if (!/^[\w\u4e00-\u9fa5-]{2,16}$/.test(n)) { loginError("用户名只能包含中文、字母、数字、下划线、连字符"); return; }
  if (pw.length < 4 || pw.length > 20) { loginError("密码需要 4-20 位"); return; }
  loginLoading("正在连接服务器…");
  /* uid 不再本地生成：登录后从账号记录（MQTT retained）取回，保证跨设备同 uid */
  me = { uid: "", name: n };
  LS.setUser(n);
  loginPwHash = await hashPw(n, pw);
  authDone = false; authRecord = null;
  client = mqtt.connect(BROKER, {
    clientId: APP + "_login_" + LS.devid() + "_" + Math.random().toString(36).slice(2, 6),
    keepalive: 30, clean: true, connectTimeout: 8000
  });
  client.on("error", () => {
    if (!authDone) { authDone = true; loginError("无法连接服务器，请检查网络后重试"); }
  });
  client.on("connect", () => {
    client.subscribe(`${APP}/auth/${me.name}`); // 注册记录（retained）：用户名唯一性 + 密码校验
    setTimeout(() => { if (!authDone) { authDone = true; doAuth(); } }, 1300);
  });
  client.on("message", (topic, payload) => {
    let m; try { m = JSON.parse(payload.toString()); } catch (e) { return; }
    if (topic === `${APP}/auth/${me.name}` && !authDone && m && m.ph) authRecord = m;
  });
};

/* 认证：用户名已注册 → 校验密码；未注册 → 自动注册（retained 记录，此后全局唯一） */
function doAuth() {
  if (authRecord) {
    if (authRecord.ph !== loginPwHash) {
      client.end(true);
      $("loginPass").value = ""; $("loginPass").focus();
      loginError("密码错误，登录失败");
      return;
    }
    /* 老账号记录里没有 uid：补写进去（此后跨设备共用同一 uid） */
    me.uid = authRecord.uid || LS.uid(me.name) || Math.random().toString(36).slice(2, 12);
    if (!authRecord.uid) {
      client.publish(`${APP}/auth/${me.name}`, JSON.stringify({ ph: authRecord.ph, reg: authRecord.reg || Date.now(), uid: me.uid }), { retain: true, qos: 1 });
    }
  } else {
    me.uid = Math.random().toString(36).slice(2, 12);
    client.publish(`${APP}/auth/${me.name}`, JSON.stringify({ ph: loginPwHash, reg: Date.now(), uid: me.uid }), { retain: true, qos: 1 });
    toast("用户名 <b>" + esc(me.name) + "</b> 注册成功，请记住密码", "ok", 6000);
  }
  /* 认证通过：写入会话（meeting.html 读取），断开本页连接，跳转 */
  LS.setUid(me.name, me.uid);
  LS.setSession({ name: me.name, uid: me.uid, devid: LS.devid(), at: Date.now() });
  loginSuccess();
  setTimeout(() => {
    try { client.end(true); } catch (e) {}
    location.href = "meeting.html";
  }, 900);
}

$("loginName").addEventListener("keydown", e => { if (e.key === "Enter") $("loginPass").focus(); });
$("loginPass").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });

/* 已有会话直接跳过登录（也可改成显示“继续以 XX 登录”按钮） */
(function () {
  const s = LS.session();
  if (s && s.name && s.uid) { location.replace("meeting.html"); return; }
  const u = LS.user();
  if (u) { $("loginName").value = u; $("loginName").focus(); }
  else $("loginName").focus();
})();
</script>
</body>
</html>
